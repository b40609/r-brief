<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:,">
<title>存取驗證</title>
<style>
:root{--bg:#f6f6f4;--surface:#ffffff;--line:rgba(28,30,33,.14);--text:#1c1e21;--muted:#686d75;--accent:#22477a;--err:#b8382a;--sans:"Noto Sans TC","Microsoft JhengHei UI","PingFang TC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--surface:#1b1c1f;--line:rgba(230,232,235,.15);--text:#e7e8ea;--muted:#8e949d;--accent:#8fb0dc;--err:#e06a5a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
.box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
h1{font-size:18px;font-weight:600;margin:0 0 6px}
p.sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
input[type=password],input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--bg);color:var(--text);font:15px var(--sans)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px;font-size:13px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;color:var(--muted)}
.toggle{background:none;border:0;color:var(--accent);font:13px var(--sans);cursor:pointer;padding:0}
button.primary{width:100%;height:42px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:500 15px var(--sans);cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
.msg{margin:12px 0 0;font-size:13px;min-height:20px;color:var(--muted)}
.msg.err{color:var(--err)}
</style>
</head>
<body>
<main class="box">
  <h1>存取驗證</h1>
  <p class="sub">此報告已於瀏覽器端加密保護，請輸入專屬密碼開啟。</p>
  <form id="f" autocomplete="off">
    <label for="pw">密碼</label>
    <input id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password" autofocus required>
    <div class="row">
      <label><input id="rem" type="checkbox" checked>在此裝置記住密碼</label>
      <button type="button" class="toggle" id="vis">顯示</button>
    </div>
    <button type="submit" class="primary" id="btn">解密開啟</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('NO_WEBCRYPTO');
  }
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256'},
    baseKey,
    {name: 'AES-GCM', length: 256},
    false,
    ['decrypt']
  );
  const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.iv)}, key, b64(BLOB.ct));
  return new TextDecoder('utf-8').decode(buf);
}

function setMsg(text, isErr) {
  const el = $('#msg');
  el.textContent = text;
  el.className = 'msg' + (isErr ? ' err' : '');
}

async function openWith(pw, save) {
  const btn = $('#btn');
  btn.disabled = true;
  setMsg('解密中，請稍候…', false);
  try {
    const html = await decrypt(pw.trim());
    try {
      if (save) localStorage.setItem(STORE_KEY, pw.trim());
      else localStorage.removeItem(STORE_KEY);
    } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    if (e && e.message === 'NO_WEBCRYPTO') {
      setMsg('此環境不支援瀏覽器加密（請透過 HTTPS 網址開啟，不要直接開本機檔案）。', true);
    } else {
      try { localStorage.removeItem(STORE_KEY); } catch (_) {}
      setMsg('密碼錯誤或已更新，請重新輸入。', true);
      $('#pw').focus();
      $('#pw').select();
    }
  }
}

$('#vis').onclick = () => {
  const inp = $('#pw');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  $('#vis').textContent = show ? '隱藏' : '顯示';
};

$('#f').onsubmit = e => {
  e.preventDefault();
  const pw = $('#pw').value;
  if (!pw.trim()) return;
  openWith(pw, $('#rem').checked);
};

try {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) openWith(saved, true);
} catch (e) {}
})();
</script>

const STORE_KEY = 'ua_share_lk_' + (location.pathname || 'default');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = s => {
  const p = s.replace(/-/g, '+').replace(/_/g, '/');
  return b64(p + '='.repeat((4 - p.length % 4) % 4));
};
async function unlock() {
  const raw = (location.hash || '').replace(/^#/, '').trim();
  const k = raw || (() => { try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; } })();
  if (!k) {
    document.getElementById('msg').textContent = '請使用完整專屬連結開啟。';
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    document.getElementById('msg').textContent = '請透過 HTTPS 網址開啟（不支援直接開本機檔案）。';
    return;
  }
  try {
    const key = await crypto.subtle.importKey('raw', b64u(k), {name: 'AES-GCM'}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.iv)}, key, b64(BLOB.ct));
    const html = new TextDecoder('utf-8').decode(buf);
    try { localStorage.setItem(STORE_KEY, k); } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    try { localStorage.removeItem(STORE_KEY); } catch (_) {}
    document.getElementById('msg').textContent = '連結無效或已更新，請向分享者取得最新連結。';
  }
}
window.addEventListener('hashchange', unlock);
unlock();
})();
